<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posting Navigator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;color:#627086}.badge{background:#172033;color:white;border-radius:999px;padding:7px 12px;font-size:13px}.grid{display:grid;grid-template-columns:380px 1fr;gap:18px}.card{background:white;border:1px solid #dfe6ef;border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(30,50,80,.06)}label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;font:inherit;border-radius:10px;border:1px solid #cbd5e1;padding:11px}button{border:0;background:#2563eb;color:white;font-weight:800;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12px;color:#708096;margin-top:5px}.status{margin-top:14px;padding:10px;border-radius:10px;background:#eef4ff;white-space:pre-wrap}.error{background:#fff0f0;color:#9b1c1c}.hidden{display:none}#map{height:610px;border-radius:12px;background:#e7edf4}.downloads a{display:inline-block;margin:6px 8px 0 0;padding:8px 10px;border-radius:8px;background:#eef4ff;color:#1d4ed8;text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{padding:10px;background:#f7f9fc;border-radius:10px}.metric b{display:block;font-size:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}#map{height:460px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="hero"><div><h1>Posting Navigator</h1><p>KMZから町丁目を選び、OSM道路ベースの巡回ルートを生成</p></div><span class="badge">v0.5.0 Public</span></div>
<div class="grid"><section class="card"><label>1. 区画KMZ</label><input id="kmz" type="file" accept=".kmz"><div class="hint">選択すると町丁目一覧を読み込みます。</div>
<label>2. 対象町丁目</label><select id="area" disabled><option>KMZを先に選択</option></select>
<label>3. 担当人数</label><input id="workers" type="number" value="4" min="1" max="30">
<label>4. 開始地点（任意）</label><div class="row"><input id="lat" type="number" step="any" placeholder="緯度 35.7005"><input id="lon" type="number" step="any" placeholder="経度 139.6925"></div><div class="hint">地図クリックでも指定できます。</div>
<label><input id="fallback" type="checkbox" checked style="width:auto"> OSM取得失敗時にオフライン確認データを使用</label>
<button id="build" disabled>巡回ルートを生成</button><div id="status" class="status">KMZを選択してください。<br><span class="hint">接続先API: <span id="apiurl"></span></span></div>
<div id="metrics" class="metrics hidden"></div><div id="downloads" class="downloads hidden"></div></section><section class="card"><div id="map"></div></section></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script><script>
const API=(window.POSTING_NAVIGATOR_API||'http://127.0.0.1:8787').replace(/\/$/,'');
const map=L.map('map').setView([35.7005,139.6925],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);let layer,marker,uploadId;
const $=id=>document.getElementById(id);$('apiurl').textContent=API;function status(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' error':'')}
map.on('click',e=>{$('lat').value=e.latlng.lat.toFixed(7);$('lon').value=e.latlng.lng.toFixed(7);if(marker)marker.remove();marker=L.marker(e.latlng).addTo(map).bindPopup('開始地点').openPopup()});
$('kmz').onchange=async()=>{const f=$('kmz').files[0];if(!f)return;status('KMZを解析中…');$('build').disabled=true;const fd=new FormData();fd.append('kmz',f);try{const r=await fetch(`${API}/api/areas`,{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.error);uploadId=j.upload_id;$('area').innerHTML=j.areas.map(x=>`<option>${x}</option>`).join('');$('area').disabled=false;$('build').disabled=false;status(`${j.areas.length}件の区画を読み込みました。`)}catch(e){status(e.message,true)}};
$('build').onclick=async()=>{status('道路取得・巡回計算・KML生成を実行中…');$('build').disabled=true;$('downloads').classList.add('hidden');try{const r=await fetch(`${API}/api/build`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({upload_id:uploadId,area:$('area').value,workers:+$('workers').value,start_lat:$('lat').value,start_lon:$('lon').value,offline_fallback:$('fallback').checked})});const j=await r.json();if(!r.ok)throw Error(j.error);status(`生成完了（データ: ${j.summary.data_mode}）`);if(layer)layer.remove();layer=L.geoJSON(j.geojson,{style:f=>({weight:f.properties?.worker_id?5:2,opacity:.85})}).addTo(map);map.fitBounds(layer.getBounds());const s=j.summary;$('metrics').innerHTML=`<div class="metric">全体距離<b>${(s.route_length_m/1000).toFixed(2)} km</b></div><div class="metric">担当人数<b>${s.worker_count}人</b></div><div class="metric">重複倍率<b>${(s.route_ratio||0).toFixed(2)}</b></div>`;$('metrics').classList.remove('hidden');const base=`${API}/download/${j.job_id}`;$('downloads').innerHTML=`<label>成果物</label><a href="${base}/posting_navigator_results.zip">一式ZIP</a><a href="${base}/posting_navigator.kmz">統合KMZ</a><a href="${base}/posting_navigator.kml">統合KML</a><a href="${base}/assignments.csv">担当CSV</a><a href="${base}/summary.json">集計JSON</a>`;$('downloads').classList.remove('hidden')}catch(e){status(e.message,true)}finally{$('build').disabled=false}};
</script></body></html>
