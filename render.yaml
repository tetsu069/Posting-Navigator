services:
  - type: web
    name: posting-navigator-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 300 posting_navigator.webapp:app
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://tetsu069.github.io
      - key: OVERPASS_USER_AGENT
        value: Posting-Navigator/1.1.8 (+https://tetsu069.github.io/Posting-Navigator/)
      - key: OVERPASS_REFERER
        value: https://tetsu069.github.io/Posting-Navigator/
      - key: MAX_UPLOAD_MB
        value: 25
      - key: GPS_THRESHOLD_M
        value: 18
      - key: SYNC_INTERVAL_MS
        value: 5000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: POSTING_NAV_DB
        value: web_runtime/posting_navigator.db
